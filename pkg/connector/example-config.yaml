# Displayname template for Google Chat ghost users.
# Variables: .Name (full name), .FirstName, .Email
displayname_template: '{{ or .Name .Email "Unknown user" }} (Google Chat)'
# How many most-recently-active chats to create portals for after login.
initial_chat_sync: 20
# Refuse to send Matrix media to Google Chat. Only useful if uploads start
# failing for your account and you prefer a clear error.
disable_outbound_media: false
# Don't download and inline the media a link chip points at (a GIF, a link
# preview image); the link is still in the message. The bridge only fetches
# the address Google supplies, over https, without cookies or proxy, and
# never from internal addresses.
disable_inline_url_media: false
# Make the `leave` command act at once instead of waiting for `leave confirm`.
# Leaving a private space can't be undone without a new invite.
skip_leave_confirmation: false
# Receive only. Nothing that changes your Google account is ever sent: no
# messages, edits, deletions, reactions, uploads, membership or room changes,
# and no read receipts or typing notifications (so reading in Matrix does not
# mark chats read on Google Chat). The bridge refuses these before any
# request leaves the process. Meant for archive-style setups.
read_only: false
# What the bridge tells Google about itself when it connects.
#   active:   an open, focused Google Chat tab with notifications on. This is
#             what the bridge has always sent.
#   inactive: an idle background tab that shows no notifications itself, so
#             the account does not look permanently active and your phone
#             keeps getting notifications.
presence: active
# The bridge sends the User-Agent of the browser the cookies came from,
# unchanged (the cURL login captures it). Set this to send another one.
user_agent: ""
# Constants of the Google Chat web client. Leave them empty (or 0) to use the
# values built into the bridge; set one only if Google rotates it before the
# bridge is updated.
protocol:
    # The `key` query parameter of every API call.
    api_key: ""
    # RequestHeader.client_version.
    client_version: 0
    # The `hs` query parameter of the /mole/world request.
    mole_world_hs: ""
# History backfill is configured in the top-level `backfill:` section.
